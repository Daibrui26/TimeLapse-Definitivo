server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: redirige cualquier ruta al index.html para que Vue Router la gestione
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso: las llamadas a /api se reenvían al contenedor del backend
    location /api {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Necesario para uploads de archivos grandes (imágenes/vídeos)
        client_max_body_size 50M;
    }
}